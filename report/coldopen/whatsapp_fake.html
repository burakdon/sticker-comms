<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>cold open</title>
<style>
  :root { --bg: #111b21; --panel: #202c33; --panel2: #2a3942; --line: #2f3b43; --text: #e9edef; --muted: #8696a0; --green: #00a884; --bubble: #202c33; --me: #005c4b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; color: var(--text); font-size: 17px; }
  .window { position: absolute; inset: 0; display: grid; grid-template-columns: 288px 420px 1fr; background: var(--bg); }

  /* ---- macOS-ish left nav ---- */
  .nav { background: #161e24; padding: 18px 14px; border-right: 1px solid var(--line); }
  .lights { display: flex; gap: 8px; margin: 0 0 30px 2px; }
  .lights i { width: 13px; height: 13px; border-radius: 50%; display: block; }
  .nav .item { display: flex; align-items: center; gap: 14px; padding: 10px 12px; border-radius: 8px; color: var(--text); font-size: 17px; }
  .nav .item.active { background: #2a3942; }
  .nav .item .n { margin-left: auto; color: var(--muted); font-size: 15px; }
  .nav .sec { color: var(--muted); font-size: 13px; margin: 18px 12px 8px; }
  .nav .you { position: absolute; bottom: 20px; left: 14px; display: flex; align-items: center; gap: 12px; }
  .ava { width: 42px; height: 42px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 22px; flex: none; }

  /* ---- chat list ---- */
  .list { border-right: 1px solid var(--line); background: var(--bg); display: flex; flex-direction: column; }
  .list .head { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px 8px; font-weight: 700; font-size: 18px; }
  .search { margin: 6px 16px 10px; background: var(--panel); border-radius: 10px; padding: 9px 14px; color: var(--muted); font-size: 16px; }
  .pills { display: flex; gap: 8px; margin: 0 16px 10px; }
  .pill { padding: 6px 14px; border-radius: 999px; background: var(--panel); color: var(--muted); font-size: 15px; }
  .pill.on { background: #0b3d33; color: #9fe1cb; }
  .row { display: flex; gap: 14px; padding: 12px 16px; border-bottom: 1px solid #1f2a30; align-items: center; }
  .row.sel { background: #2a3942; }
  .row .ava { width: 54px; height: 54px; font-size: 26px; }
  .row .meta { flex: 1; min-width: 0; }
  .row .t { display: flex; justify-content: space-between; font-weight: 600; font-size: 17px; }
  .row .t .time { color: var(--muted); font-weight: 400; font-size: 14px; }
  .row .p { color: var(--muted); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
  .row .badge { background: var(--green); color: #111; font-weight: 700; font-size: 13px; border-radius: 999px; padding: 2px 8px; margin-left: 8px; }

  /* ---- chat pane ---- */
  .chat { position: relative; display: flex; flex-direction: column; background: #0b141a; }
  .chat::before { content: ""; position: absolute; inset: 0; opacity: .06; background-image: radial-gradient(circle at 20px 20px, #fff 2px, transparent 2.5px), radial-gradient(circle at 60px 50px, #fff 1.5px, transparent 2px); background-size: 90px 80px; }
  .chead { position: relative; z-index: 2; display: flex; align-items: center; gap: 14px; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .chead .name { font-weight: 700; font-size: 18px; }
  .chead .sub { color: var(--muted); font-size: 14px; }
  .chead .sub.typing { color: #9fe1cb; }
  .chead .right { margin-left: auto; color: var(--muted); font-size: 22px; letter-spacing: 6px; }
  .msgs { position: relative; z-index: 1; flex: 1; overflow: hidden; padding: 16px 70px 16px 56px; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; }
  .m { display: flex; gap: 10px; align-items: flex-end; }
  .m .ava { width: 36px; height: 36px; font-size: 18px; }
  .m .box { background: var(--bubble); border-radius: 10px; padding: 8px 12px; max-width: 620px; box-shadow: 0 1px 1px rgba(0,0,0,.3); position: relative; }
  .m .box.sticker { background: transparent; box-shadow: none; padding: 0; }
  .m .who { font-weight: 600; font-size: 15px; margin-bottom: 2px; }
  .m .txt { font-size: 17px; }
  .m .time { color: var(--muted); font-size: 12px; margin-left: 14px; }
  .m img.stk { width: 190px; height: 190px; object-fit: contain; display: block; border-radius: 12px; }
  .m .react { display: inline-block; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; font-size: 14px; margin: 2px 0 0 8px; }
  .m .stamp { color: var(--muted); font-size: 12px; background: var(--panel); border-radius: 10px; padding: 3px 8px; display: inline-block; margin-top: 4px; }
  .input { position: relative; z-index: 2; display: flex; align-items: center; gap: 14px; padding: 14px 20px; background: var(--panel); }
  .input .field { flex: 1; background: var(--panel2); border-radius: 10px; height: 44px; }
  .input .plus, .input .mic { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; color: var(--muted); }
  .input .mic { background: var(--green); color: #fff; }

  /* ---- "wrong screen" layer ---- */
  .sharebar { position: absolute; top: 0; left: 60%; transform: translateX(-50%); z-index: 50; display: flex; align-items: center; gap: 14px; background: #1f8f4e; color: #fff; padding: 6px 10px 6px 16px; border-radius: 0 0 10px 10px; font-size: 15px; font-weight: 600; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
  .sharebar .stop { background: #d9342b; color: #fff; padding: 6px 12px; border-radius: 6px; font-weight: 700; }
  #cursor { position: absolute; z-index: 60; width: 26px; height: 36px; left: 1100px; top: 640px; pointer-events: none; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
  .toast { position: absolute; z-index: 55; right: 24px; top: 70px; width: 360px; background: rgba(32,44,51,.96); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: none; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .toast.show { display: block; animation: pop .25s ease-out; }
  .toast .tt { font-weight: 700; font-size: 15px; } .toast .tb { color: var(--muted); font-size: 14px; margin-top: 2px; }
  @keyframes pop { from { transform: translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }
</style>
</head>
<body>
<div class="window">
  <div class="nav">
    <div class="lights"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
    <div class="item active">💬 Chats</div>
    <div class="item">◎ Updates</div>
    <div class="item">👥 Communities</div>
    <div class="item">📞 Calls <span class="n">41</span></div>
    <div class="item">🖼 Media</div>
    <div class="item">✦ Meta AI</div>
    <div class="sec">More</div>
    <div class="item">🗄 Archived <span class="n">2</span></div>
    <div class="item">☆ Starred</div>
    <div class="you"><span class="ava" style="background:#3a4048">🧑‍💻</span> You</div>
  </div>

  <div class="list">
    <div class="head"><span>Chats</span><span style="color:#00a884;font-size:26px;font-weight:400">⊕</span></div>
    <div class="search">🔍 Search</div>
    <div class="pills"><span class="pill on">All</span><span class="pill">Unread</span><span class="pill">Favorites</span><span class="pill">Groups</span></div>
    <div class="row"><span class="ava" style="background:#2a3942">🗄</span><div class="meta"><div class="t">Archived <span class="time">2</span></div></div></div>
    <div id="rows"></div>
  </div>

  <div class="chat">
    <div class="chead">
      <span class="ava" style="background:#1f8f4e">👥</span>
      <div><div class="name">AIPI ‼️</div><div class="sub" id="sub">2 online</div></div>
      <div class="right">▢ ⋯</div>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="input"><span class="plus">＋</span><div class="field"></div><span class="mic">🎤</span></div>
    <div class="toast" id="toast"><div class="tt">AIPI ‼️</div><div class="tb" id="toastb">Sticker</div></div>
  </div>

  <div class="sharebar">● You are screen sharing <span class="stop">Stop Share</span></div>
  <svg id="cursor" viewBox="0 0 26 36"><path d="M2 2 L2 28 L9 21 L14 33 L19 31 L14 19 L24 19 Z" fill="#fff" stroke="#000" stroke-width="2" stroke-linejoin="round"/></svg>
</div>

<script>
const STK = "../../stimuli/";
const stickers = [
  "TR_NOTXT_02","EN_NOTXT_04","TR_TXT_06","CN_TXT_02","EN_TXT_03","TR_NOTXT_01","CN_NOTXT_01","EN_NOTXT_05","TR_TXT_03",
  "CN_TXT_05","EN_TXT_05","TR_NOTXT_05","CN_NOTXT_06","EN_NOTXT_01","TR_TXT_01","CN_TXT_01","EN_TXT_06","TR_NOTXT_04",
  "CN_NOTXT_03","EN_NOTXT_03","TR_TXT_02","CN_TXT_04","EN_TXT_01","TR_NOTXT_06","CN_NOTXT_05","EN_NOTXT_02","TR_TXT_05",
  "CN_TXT_03","EN_TXT_02","TR_NOTXT_03","CN_NOTXT_02","TR_TXT_04","CN_TXT_06","EN_TXT_04","CN_NOTXT_04","EN_NOTXT_06",
  "TR_TXT_spare_hsktr"
].map(s => STK + s + ".webp");
const senders = [
  { n: "Mehmet", c: "#e67e22", a: "🧔", bg: "#5a3a1a" }, { n: "Lexie", c: "#9b59b6", a: "👩", bg: "#3d2a4a" },
  { n: "David", c: "#1abc9c", a: "🧑", bg: "#1f4a44" }, { n: "~ Snehal", c: "#e74c3c", a: "S", bg: "#5a2a2a" },
  { n: "Yiran", c: "#f1c40f", a: "🧑‍🎓", bg: "#4a4320" }, { n: "Alberto", c: "#3498db", a: "👨", bg: "#1f3a52" },
];
const rowsData = [
  ["AIPI ‼️", "Mehmet: We need a sticker made out of this like rn", "22:57", "#1f8f4e", "👥", true],
  ["NYC Baddies", "~ Snehal: https://www.instagram.com/…", "22:53", "#4a3b1f", "👥", false],
  ["Laser tag", "You: ima mail it to you if you win dw", "22:41", "#1f3a52", "🔫", false],
  ["Roommates", "Lexie: who finished the oat milk", "21:30", "#3d2a4a", "🏠", false],
  ["Mom ❤️", "Did you eat", "20:07", "#5a2a2a", "👩‍🦳", false],
  ["Squishy supplier", "You: can i get 2 more by monday", "19:45", "#4a4320", "🧸", false],
  ["Teammate 🐼", "✓✓ ok if you say so lol", "18:12", "#1f4a44", "🐼", false],
  ["Bros", "~ Perry: 📷 Photo", "17:58", "#2a3942", "🐑", false],
  ["+1 (628) 209-XXXX", "✓✓ @~Perry why you don't re…", "16:56", "#2a3942", "🦉", false],
  ["Prof. office hours", "see you thursday", "15:20", "#5a3a1a", "🎓", false],
  ["Dentist", "Reminder: appointment Nov 5, 9:00", "11:02", "#1f2a30", "🦷", false],
];
const rowsEl = document.getElementById("rows");
rowsData.forEach(([n, p, t, bg, a, sel]) => {
  rowsEl.insertAdjacentHTML("beforeend", `<div class="row ${sel ? "sel" : ""}"><span class="ava" style="background:${bg}">${a}</span><div class="meta"><div class="t"><span>${n}</span><span class="time">${t}</span></div><div class="p">${p}</div></div></div>`);
});
const aipiRow = rowsEl.querySelector(".row.sel");

const msgs = document.getElementById("msgs");
function textMsg(s, txt, time) {
  msgs.insertAdjacentHTML("beforeend", `<div class="m"><span class="ava" style="background:${s.bg}">${s.a}</span><div class="box"><div class="who" style="color:${s.c}">${s.n}</div><div class="txt">${txt}<span class="time">${time}</span></div></div></div>`);
}
function stickerMsg(s, src, time, react) {
  msgs.insertAdjacentHTML("beforeend", `<div class="m"><span class="ava" style="background:${s.bg}">${s.a}</span><div class="box sticker"><div class="who" style="color:${s.c};margin:0 0 4px 4px">${s.n}</div><img class="stk" src="${src}"><span class="stamp">${time}</span>${react ? `<span class="react">${react}</span>` : ""}</div></div>`);
  while (msgs.children.length > 14) msgs.removeChild(msgs.firstChild);
}
// a calm starting state
textMsg(senders[0], "We need a sticker made out of this like rn", "22:57");
textMsg(senders[1], "Gotchu", "22:57");
stickerMsg(senders[1], STK + "EN_NOTXT_02.webp", "22:57", "❤️");
textMsg(senders[2], "He lost an arm in the process, oof", "22:58");

// ---- timeline (ms) ----
const T0 = performance.now();
const now = () => performance.now() - T0;
let count = 0, unread = 0;
const reacts = ["😂", "😭", "💀", "❤️", "😂 3", "🤣", "👀"];
const sub = document.getElementById("sub"), toast = document.getElementById("toast"), toastb = document.getElementById("toastb");
function clock() { const m = 22 * 60 + 58 + Math.floor(now() / 8000); return `${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")}`; }
function burst() {
  const t = now();
  if (t > 19600) return;
  const s = senders[Math.floor(Math.random() * senders.length)];
  const src = stickers[count % stickers.length];
  stickerMsg(s, src, clock(), Math.random() < 0.3 ? reacts[Math.floor(Math.random() * reacts.length)] : "");
  count++; unread++;
  aipiRow.querySelector(".p").textContent = `${s.n}: 🎟 Sticker`;
  aipiRow.querySelector(".time").textContent = clock();
  let b = aipiRow.querySelector(".badge"); if (!b) { b = document.createElement("span"); b.className = "badge"; aipiRow.querySelector(".t").appendChild(b); } b.textContent = unread;
  sub.textContent = `${s.n} is typing…`; sub.classList.add("typing");
  setTimeout(() => { sub.textContent = `${3 + Math.floor(count / 6)} online`; sub.classList.remove("typing"); }, 400);
  if (count % 5 === 0) { toastb.textContent = `${s.n}: 🎟 Sticker`; toast.classList.remove("show"); void toast.offsetWidth; toast.classList.add("show"); setTimeout(() => toast.classList.remove("show"), 1400); }
  // pace: 1.1 s between stickers at the start, 110 ms by the end
  const interval = Math.max(110, 1100 - (t - 1500) * 0.07);
  setTimeout(burst, interval);
}
setTimeout(burst, 1500);

// ---- cursor: idle, then a panicked path to "Stop Share", overshoots, lands at the end ----
const cur = document.getElementById("cursor");
const stop = document.querySelector(".sharebar .stop").getBoundingClientRect();
const target = { x: stop.left + stop.width / 2 - 2, y: stop.top + stop.height / 2 - 2 };
const path = [
  [0, 1100, 640], [9000, 1120, 655], [11000, 1300, 500], [12500, 700, 300], [13500, 1500, 120], [14500, 1040, 40],
  [15200, 1180, 28], [15800, 860, 60], [16600, target.x - 60, target.y + 30], [17300, target.x + 40, target.y - 12],
  [18200, target.x - 18, target.y + 8], [19000, target.x, target.y], [21000, target.x, target.y],
];
function lerp(a, b, k) { return a + (b - a) * k; }
function ease(k) { return k < .5 ? 2 * k * k : -1 + (4 - 2 * k) * k; }
function tick() {
  const t = now();
  for (let i = 0; i < path.length - 1; i++) {
    const [t1, x1, y1] = path[i], [t2, x2, y2] = path[i + 1];
    if (t >= t1 && t < t2) {
      const k = ease((t - t1) / (t2 - t1)), jitter = t > 12000 && t < 19000 ? Math.sin(t / 37) * 2 : 0;
      cur.style.left = lerp(x1, x2, k) + jitter + "px"; cur.style.top = lerp(y1, y2, k) + jitter + "px";
    }
  }
  if (t < 21000) requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
